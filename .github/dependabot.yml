version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: all
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: all
    open-pull-requests-limit: 1
